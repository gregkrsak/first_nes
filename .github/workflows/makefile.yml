name: Makefile CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  makefile-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether the cc65 directory exists
        id: check_cc65
        uses: andstor/file-existence-action@v1
        with:
          files: "cc65"

      - name: Install cc65
        if: steps.check_cc65.outputs.files_exists == 'false'
        run: |
          rm -rf cc65
          git clone https://github.com/cc65/cc65.git
          cd cc65
          make
          make avail

      - name: Build first_nes ROM
        run: make
