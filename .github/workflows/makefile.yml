name: Build & Validate NES ROM

on:
  push:
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

env:
  CC65_VERSION: V2.19

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build pinned cc65 toolchain
        run: |
          git clone --depth 1 --branch "${CC65_VERSION}" https://github.com/cc65/cc65.git .cc65
          make -C .cc65 -j"$(nproc)"
          echo "$PWD/.cc65/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          ca65 --version
          ld65 --version

      - name: Build first_nes ROM
        run: make

      - name: Validate iNES structure
        run: python3 scripts/validate_rom.py first_nes.nes

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: first_nes-${{ github.sha }}
          path: first_nes.nes
          if-no-files-found: error
