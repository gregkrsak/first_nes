  <g transform="translate(282 338) scale(2)">
    <rect x="5" y="0" width="6" height="1" fill="#2850dc"/>
    <rect x="4" y="1" width="8" height="1" fill="#1ee6e6"/>
    <rect x="3" y="2" width="10" height="4" fill="#1ee6e6"/>
