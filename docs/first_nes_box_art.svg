    <path d="M0 0h168l-18 98H0z" fill="#ef3d3d"/>
    <rect x="18" y="18" width="112" height="48" fill="#111" stroke="#d6c9aa" stroke-width="4"/>
    <rect x="35" y="34" width="28" height="10" fill="#a9a9a9"/>
    <rect x="44" y="25" width="10" height="28" fill="#a9a9a9"/>
