    <rect x="4" y="6" width="8" height="2" fill="#2850dc"/>
    <rect x="5" y="8" width="6" height="4" fill="#1ee6e6"/>
    <rect x="3" y="9" width="2" height="3" fill="#2850dc"/>
    <rect x="11" y="9" width="2" height="3" fill="#2850dc"/>
