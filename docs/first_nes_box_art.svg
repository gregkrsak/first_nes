    <rect x="70" y="164" width="6" height="12"/><rect x="70" y="190" width="6" height="12"/><rect x="70" y="216" width="6" height="12"/>
    <rect x="524" y="86" width="6" height="12"/><rect x="524" y="112" width="6" height="12"/><rect x="524" y="138" width="6" height="12"/>
