  <!-- title -->
  <g transform="translate(115 0) skewX(-8)">
    <text x="0" y="548" fill="#f33fa5" font-family="monospace" font-size="70" font-weight="900">first_nes</text>
    <text x="-6" y="540" fill="#31c8f4" font-family="monospace" font-size="70" font-weight="900">first_nes</text>
