    <rect x="264" y="414" width="18" height="4"/><rect x="296" y="414" width="18" height="4"/><rect x="328" y="414" width="18" height="4"/>
    <rect x="360" y="414" width="18" height="4"/><rect x="392" y="414" width="18" height="4"/><rect x="424" y="414" width="18" height="4"/>
    <rect x="456" y="414" width="18" height="4"/><rect x="488" y="414" width="18" height="4"/>
  </g>

