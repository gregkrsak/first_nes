    <rect x="264" y="402" width="20" height="8"/><rect x="296" y="402" width="20" height="8"/><rect x="328" y="402" width="20" height="8"/>
    <rect x="360" y="402" width="20" height="8"/><rect x="392" y="402" width="20" height="8"/><rect x="424" y="402" width="20" height="8"/>
    <rect x="456" y="402" width="20" height="8"/><rect x="488" y="402" width="20" height="8"/>
